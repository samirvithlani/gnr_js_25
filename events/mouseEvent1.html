<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./mouseEvent1.js"></script>
  </head>

  <style>
    .box{
         height: 200px;
        width: 200px;
        background-color: black;
        border: 1px solid white;
    }
    .box2{
         height: 300px;
        width: 300px;
        background-color: pink;
        border: 1px solid white;
    }
  </style>
  <body>
    <div
      onmouseenter="changeColor()"
      onmouseleave="changeColor2()"
      id="box"
      style="
        height: 200px;
        width: 200px;
        background-color: black;
        border: 1px solid white;
      "
    ></div>
    <div class="box" id="box2" onmouseenter="changeColor3()"></div>
  </body>
</html>
